[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/"
  to = "/pages/homepage.html"
  status = 200

[[redirects]]
  from = "/homepage"
  to = "/pages/homepage.html"
  status = 200

[[redirects]]
  from = "/kibo"
  to = "/pages/kibo.html"
  status = 200

[[redirects]]
  from = "/lingzi"
  to = "/pages/lingzi.html"
  status = 200

[[redirects]]
  from = "/equipments"
  to = "/pages/equipments.html"
  status = 200

[[redirects]]
  from = "/materials"
  to = "/pages/materials.html"
  status = 200

[[redirects]]
  from = "/kibo/:id"
  to = "/pages/kibo/:id.html"
  status = 200

[[redirects]]
  from = "/lingzi/:id"
  to = "/pages/lingzi/:id.html"
  status = 200

[[redirects]]
  from = "/equipments/:id"
  to = "/pages/equipments/:id.html"
  status = 200

[[redirects]]
  from = "/materials/:id"
  to = "/pages/materials/:id.html"
  status = 200
