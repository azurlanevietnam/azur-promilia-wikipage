# ===================================================================
# NGINX REWRITE CONFIGURATION FOR FLASHPANEL (apvnwiki.tech)
# ===================================================================
# Hướng dẫn sử dụng trong FlashPanel:
# 1. Truy cập FlashPanel -> Quản lý Website -> Chọn domain "apvnwiki.tech"
# 2. Vào mục "Nginx Config" hoặc "Rewrite Rules"
# 3. Dán các đoạn cấu hình bên dưới vào khối server { ... } của domain.
# ===================================================================

# 1. Tự động phục vụ trang chủ khi truy cập root domain (apvnwiki.tech/)
location = / {
    rewrite ^ /pages/homepage.html last;
}

# 2. Xử lý URL đẹp (Clean URLs) không cần lộ thư mục /pages/ và không cần đuôi .html
# Ví dụ:
#   apvnwiki.tech/homepage              -> phục vụ ngầm pages/homepage.html
#   apvnwiki.tech/equipments            -> phục vụ ngầm pages/equipments.html
#   apvnwiki.tech/materials             -> phục vụ ngầm pages/materials.html
#   apvnwiki.tech/equipments/amhoalieuloan -> phục vụ ngầm pages/equipments/amhoalieuloan.html
#   apvnwiki.tech/materials/banhxematvan   -> phục vụ ngầm pages/materials/banhxematvan.html
location / {
    # Ưu tiên 1: Phục vụ trực tiếp nếu là file tĩnh có thật (assets, style.css, templates, datas...)
    # Ưu tiên 2: Tìm file tương ứng trong thư mục /pages/ có thêm đuôi .html
    # Ưu tiên 3: Tìm file tương ứng trong thư mục /pages/
    try_files $uri $uri/ /pages/$uri.html /pages/$uri =404;
}

# 3. Nếu người dùng gõ có đuôi .html (ví dụ apvnwiki.tech/homepage.html), rewrite ngầm vào /pages/
location ~ ^/([^/]+)\.html$ {
    try_files /pages/$1.html /pages/$1 =404;
}

# 4. Canonical redirect: Nếu ai đó truy cập đường dẫn có chứa /pages/, chuyển hướng 301 sạch đẹp
location ^~ /pages/ {
    rewrite ^/pages/(.*)\.html$ /$1 permanent;
    rewrite ^/pages/(.*)$ /$1 permanent;
}

# 5. Tối ưu bộ nhớ đệm (Cache) cho toàn bộ tài nguyên tĩnh (assets, css, js, json)
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
