server {
    listen 80;
    listen [::]:80;

    server_name www.apvnwiki.tech apvnwiki.tech;

    location ^~ /.well-known/acme-challenge {
        auth_basic off;
        allow all;
        alias /home/apvnwikitech/.ssl;
    }

    location / {
        return 301 https://apvnwiki.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    ssl_certificate /root/.flashpanel/certificates/139589/server.crt;
    ssl_certificate_key /root/.flashpanel/certificates/139589/server.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FlashSSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/nginx/dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    server_name www.apvnwiki.tech apvnwiki.tech;

    location ^~ /.well-known/acme-challenge {
        auth_basic off;
        allow all;
        alias /home/apvnwikitech/.ssl;
    }

    if ($bad_cookie_ng) {
        set $ng_reason "${ng_reason}:bad_cookie_${bad_cookie_ng}:";
        return 403;
    }

    if ($not_allowed_method_ng) {
        set $ng_reason "${ng_reason}:not_allowed_method_${not_allowed_method_ng}:";
        return 405;
    }

    if ($bad_referer_ng) {
        set $ng_reason "${ng_reason}:bad_referer_${bad_referer_ng}:";
        return 403;
    }

    if ($bad_bot_ng) {
        set $ng_reason "${ng_reason}:bad_bot_${bad_bot_ng}:";
        return 403;
    }

    if ($bad_querystring_ng) {
        set $ng_reason "${ng_reason}:bad_querystring_${bad_querystring_ng}:";
        return 403;
    }

    if ($bad_request_ng) {
        set $ng_reason "${ng_reason}:bad_request_${bad_request_ng}:";
        return 403;
    }

    server_tokens off;
    root /home/apvnwikitech/apvnwiki.tech;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.html index.php;

    charset utf-8;

    location = / {
        return 301 /homepage;
    }

    location ^~ /pages/ {
        rewrite ^/pages/(.*)\.html$ /$1 permanent;
        rewrite ^/pages/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /pages$uri.html /pages$uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log  /var/log/nginx/apvnwiki.tech-error.log error;

    location ~ \.php$ {
        try_files $uri $uri/ =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(3gp|gif|jpg|jpeg|png|ico|wmv|avi|asf|asx|mpg|mpeg|mp4|pls|mp3|mid|wav|swf|flv|exe|zip|tar|rar|gz|tgz|bz2|uha|7z|doc|docx|xls|xlsx|pdf|iso|eot|svg|ttf|woff|woff2)$ {
        gzip_static off;
        add_header Pragma public;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(txt|js|css|json)$ {
        add_header Pragma public;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        access_log off;
        expires 30d;
        try_files $uri =404;
    }
}
