e": "Cái Gọi Là Duyên Phận", "text": "“Vừa đến Kính Hoa Châu, vì ham vui ta suýt chút nữa đã lộ chân thân, may sao bên cạnh có rừng đào rậm rạp cho ta ẩn náu, đó chính là 'Duyên'; còn để hồi phục pháp lực, ta đã lỡ ăn bánh điểm tâm người dân dâng cúng, nên buộc phải giúp họ hoàn thành ước nguyện, đó chính là 'Quả'...”"}, {"title": "Trí Tuệ Của Sự Buông Bỏ", "text": "“Duyên phận vốn không thể cưỡng cầu, hợp thì ở, tan thì đi.”<br>Dù luôn trân quý từng mối duyên, Tiểu Ngọc không bao giờ chấp niệm phải tác hợp bằng được cho từng người đến cầu nguyện nơi rừng đào. Nếu duyên nay đã cạn mà lòng người vẫn cố chấp không chịu buông tay, thì chỉ khiến họ bỏ lỡ mất những mối duyên lành mai sau."}, {"title": "Thiếu Nữ Kết Duyên", "text": "Dẫu biết nhân duyên huyền diệu khôn lường, nhưng sau ba ngày liền bận rộn chân không chạm đất để giúp các cặp vợ chồng hòa giải, bạn bè nối lại tình xưa, thư tay thất lạc tìm về đúng chủ... Nàng thiếu nữ kết duyên cũng đành ngửa mặt than trời: 'Thỉnh thoảng cũng phải cho ta một ngày sống bình yên chứ!'"}, {"title": "Mẹo Nhỏ Hâm Nóng Không Khí", "text": "Giao tiếp với mọi người là một môn học thâm sâu. Ngoài việc thu thập những câu chuyện mới lạ diễn ra mỗi ngày để dễ dàng mở đầu cuộc trò chuyện, Tiểu Ngọc còn thuần thục một vài trò ảo thuật nhỏ mua vui như gấp giấy hóa thành đóa hoa tươi thắm.<br>Có lẽ, đây cũng là một phương thức rèn luyện năng lực biến hóa của nàng chăng?"}], "icon": "assets/characters/icons/tushanxiaoyu.png", "portrait": "assets/characters/portraits/tushanxiaoyu.png", "english_name": "Tushan Xiaoyu", "is_hanviet": true};</script>
