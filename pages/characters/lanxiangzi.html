ức ăn mang phong cách u ám đặc trưng do chính tay mình nấu, người bình thường chắc chắn sẽ cần không ít lòng dũng cảm mới dám nếm thử."}], "icon": "assets/characters/icons/lanxiangzi.png", "portrait": "assets/characters/portraits/lanxiangzi.png", "english_name": "Lanxiangzi", "is_hanviet": true};</script>
