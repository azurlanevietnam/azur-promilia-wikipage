 {"tier": "XI", "name": "Bông Lúa Trĩu Hạt · Hoàng, Thùy Quang Trấn Ách · Hoàng, Hung Dực Đoạn Không · Hoàng, Tinh Thần Vĩnh Diệu · Hoàng, Tinh Thần Vĩnh Diệu · Hoàng", "upgrade": "Tấn Công +16, Phòng Ngự +4, Sinh Mệnh +80"}, {"tier": "XII", "name": "Đào Hoa Mê Mộng · Hoàng, Viêm Tông Nhiên Hồn · Hoàng, Tinh Thần Vĩnh Diệu · Hoàng, Tinh Thần Vĩnh Diệu · Hoàng, Tinh Thần Vĩnh Diệu · Hoàng", "upgrade": ""}], "stories": [{"title": "Nhất Tâm Hướng Võ", "text": "Tuy là một chú Pami nhỏ bé nhưng Peipei luôn ấp ủ giấc mộng võ hiệp lớn lao. Lớn lên giữa núi rừng thanh tịnh, một ngày nọ tình cờ trông thấy hai vị cao thủ so tài quyền pháp, Peipei lập tức bị mê hoặc bởi thân thủ thoăn thoắt biến hóa khôn lường của họ và hạ quyết tâm theo học võ nghệ. Vừa có thể tung chiêu thật oai phong, lại vừa hái măng trúc tiện lợi hơn gấp bội phần!"}, {"title": "Vở Tuồng Kiếm Hiệp", "text": "Ngơ ngác vào thành, bước chân vào hý viện và thưởng thức một vở kịch võ hiệp đặc sắc (dù chẳng hiểu hết ý nghĩa), Peipei hoàn toàn bùng cháy niềm đam mê mãnh liệt với các đại hí kiếm hiệp. Cứ mỗi lần rạp diễn tuồng mới, dưới hàng ghế khán giả luôn có một Peipei với đôi mắt sáng rực, đem toàn bộ tiền tiết kiệm được dồn hết để mua vé xem kịch."}, {"title": "Phương Pháp Luyện Võ Mới", "text": "Kể từ ngày đảm nhận công việc thu ngân và chạy bàn tại Cát Dật Lầu, Peipei không còn những khoảng thời gian dài thảnh thơi để luyện công như trước. Nàng bèn sáng tạo ra một lối đi riêng — chỉ thấy Peipei thi triển một chiêu 'Quỳ Hoa Điểm Sổ Thủ', ngón tay thoăn thoắt tính toán rành mạch hóa đơn của thực khách chỉ trong chớp mắt."}, {"title": "Nghe Tiếng Kibo Múa Võ", "text": "Peipei có thói quen thức dậy từ rất sớm để chuẩn bị cho giờ mở cửa quán ăn, sau đó tranh thủ chút thời gian ít ỏi luyện tập các thế tấn cơ bản của người học võ. Để tránh ngủ quên, nàng đã giao ước cùng Kibo thân thiết của mình: nếu đến giờ hẹn mà nàng chưa mở mắt, chú Kibo nhỏ sẽ nhảy lên đánh thức nàng dậy."}, {"title": "Trạng Thái Khẩn Cấp...", "text": "Dù đã trải qua biết bao thăng trầm và gặp gỡ nhiều người tại Cát Dật Lầu, Peipei thỉnh thoảng vẫn rất dễ bị căng thẳng. Một khi thần kinh quá tải, nàng sẽ lập tức chuyển sang trạng thái khẩn cấp: sợi tóc trên đỉnh đầu rủ xuống, ánh mắt trở nên lạnh tanh vô hồn, nhưng trong miệng lại tuôn ra những lời nhận xét sắc bén chí mạng đánh trúng tim đen người nghe."}], "icon": "assets/characters/icons/peipei.png", "portrait": "assets/characters/portraits/peipei.png", "english_name": "Peipei", "is_hanviet": false};</script>
